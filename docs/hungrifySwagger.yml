openapi: 3.0.1
info:
  title: Hungrify API
  license:
    name: MIT License
    url: https://choosealicense.com/licenses/mit/
  version: '1.0'
servers:
  - url: http://localhost:8080
    description: Server URL in Development environment
  - url: https://manve-api.com
    description: Server URL in QA environment
tags:
  - name: Users
    description: Profile, addresses and preferences
  - name: Orders
    description: Place, view and rate orders
  - name: Admin - Transactions
    description: View and manage payment transactions
  - name: Restaurant
    description: Restaurant profile, dashboard & alerts
  - name: Admin
    description: Admin dashboard and management APIs
  - name: Cart
    description: Manage user cart stored in profile_json
  - name: Search
    description: Combined restaurant and food item search
  - name: Menu
    description: Menu CRUD, low-stock, item details, parse-ingredients
  - name: Deliveries
    description: Delivery partner endpoints
paths:
  /users/me:
    get:
      tags:
        - Users
      summary: Get current authenticated user's profile
      operationId: getMe
      parameters:
        - name: userId
          in: query
          required: false
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/UserProfileDto'
    put:
      tags:
        - Users
      summary: Update current authenticated user's profile
      operationId: updateMe
      parameters:
        - name: userId
          in: query
          required: false
          schema:
            type: integer
            format: int64
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateUserRequestDto'
        required: true
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/UserProfileDto'
  /restaurants/profile:
    put:
      tags:
        - Restaurant
      summary: Update restaurant profile
      description: PUT /api/v1/restaurants/profile — updates open hours and meta
      operationId: updateProfile
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateProfileRequestDto'
        required: true
      responses:
        '200':
          description: Updated
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/RestaurantDetailDto'
        '400':
          description: Validation error
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/RestaurantDetailDto'
        '404':
          description: Not found
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/RestaurantDetailDto'
  /restaurants/menu/items/{itemId}:
    get:
      tags:
        - Menu
      summary: Get single item detail
      operationId: getItem
      parameters:
        - name: itemId
          in: path
          description: Item id
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/FoodItemDetailDto'
    put:
      tags:
        - Menu
      summary: Edit (replace) a menu item
      operationId: updateItem
      parameters:
        - name: itemId
          in: path
          description: Item id
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateFoodItemRequestDto'
        required: true
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/FoodItemDetailDto'
    delete:
      tags:
        - Menu
      summary: Soft delete item
      operationId: deleteItem
      parameters:
        - name: itemId
          in: path
          description: Item id
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: OK
    patch:
      tags:
        - Menu
      summary: Inline update item (price/qty/availability)
      operationId: patchItem
      parameters:
        - name: itemId
          in: path
          description: Item id
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchFoodItemRequestDto'
        required: true
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/FoodItemDetailDto'
  /orders/{orderId}/status:
    get:
      tags:
        - Orders
      summary: Fetch order status timeline
      operationId: getOrderStatus
      parameters:
        - name: orderId
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/OrderStatusResponseDto'
    put:
      tags:
        - Orders
      summary: Update order status
      description: |
        Allows restaurants or system to update order state.
        Supported transitions: pending → confirmed → preparing → out_for_delivery → delivered → cancelled.
        Automatically syncs with delivery entity if applicable.
      operationId: updateOrderStatus
      parameters:
        - name: orderId
          in: path
          description: Order ID
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OrderStatusUpdateRequestDto'
        required: true
      responses:
        '200':
          description: Status updated successfully
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/OrderStatusResponseDto'
        '404':
          description: Order not found
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/OrderStatusResponseDto'
  /users/me/addresses:
    post:
      tags:
        - Users
      summary: Add address to current user's profile
      operationId: addAddress
      parameters:
        - name: userId
          in: query
          required: false
          schema:
            type: integer
            format: int64
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AddAddressRequestDto'
        required: true
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                type: object
                additionalProperties:
                  type: string
  /restaurants/menu/parse-ingredients:
    post:
      tags:
        - Menu
      summary: Parse ingredients (mocked AI)
      operationId: parseIngredients
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ParseIngredientsRequestDto'
        required: true
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/CreateFoodItemRequestDto'
  /restaurants/menu/items:
    post:
      tags:
        - Menu
      summary: Create a menu item
      operationId: createItem
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateFoodItemRequestDto'
        required: true
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/FoodItemDetailDto'
  /orders:
    get:
      tags:
        - Orders
      summary: List all orders for a user
      operationId: listUserOrders
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/OrderSummaryDto'
    post:
      tags:
        - Orders
      summary: Place a new order atomically
      operationId: placeOrder
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PlaceOrderRequestDto'
        required: true
      responses:
        '200':
          description: Order placed successfully
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/OrderDetailDto'
        '400':
          description: Invalid or unavailable items
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/OrderDetailDto'
  /orders/ratings:
    post:
      tags:
        - Orders
      summary: Submit order rating
      operationId: submitRating
      parameters: []
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RatingRequestDto'
        required: true
      responses:
        '200':
          description: OK
  /image/upload:
    post:
      tags:
        - image-controller
      operationId: uploadImages
      requestBody:
        content:
          application/json:
            schema:
              required:
                - files
              type: object
              properties:
                files:
                  type: array
                  items:
                    type: string
                    format: binary
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                type: object
  /deliveries/{deliveryId}/mark-delivered:
    post:
      tags:
        - Deliveries
      summary: Mark delivery as completed
      operationId: markDelivered
      parameters:
        - name: deliveryId
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/DeliveryActionResponseDto'
  /deliveries/{deliveryId}/confirm-pickup:
    post:
      tags:
        - Deliveries
      summary: Confirm pickup of order
      operationId: confirmPickup
      parameters:
        - name: deliveryId
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/DeliveryActionResponseDto'
  /deliveries/{deliveryId}/accept:
    post:
      tags:
        - Deliveries
      summary: Accept or decline a delivery assignment
      operationId: acceptAssignment
      parameters:
        - name: deliveryId
          in: path
          required: true
          schema:
            type: integer
            format: int64
        - name: partnerUserId
          in: query
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AcceptDeliveryRequestDto'
        required: true
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/DeliveryActionResponseDto'
  /cart/save:
    post:
      tags:
        - Cart
      summary: Persist cart (optional explicit save)
      operationId: saveCart
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/CartResponseDto'
  /cart/remove:
    post:
      tags:
        - Cart
      summary: Remove/decrement food from cart
      operationId: removeFromCart
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CartRemoveRequestDto'
        required: true
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/CartResponseDto'
  /cart/clear:
    post:
      tags:
        - Cart
      summary: Clear all items from cart
      operationId: clearCart
      responses:
        '200':
          description: OK
  /cart/add:
    post:
      tags:
        - Cart
      summary: Add food to cart (enforces single restaurant constraint)
      operationId: addToCart
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CartAddRequestDto'
        required: true
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/CartResponseDto'
  /auth/signup:
    post:
      tags:
        - auth-controller
      operationId: registerUser
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SignupRequest'
        required: true
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                type: object
  /auth/signin:
    post:
      tags:
        - auth-controller
      operationId: authenticateUser
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
        required: true
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                type: object
  /admin/restaurants/{id}/reject:
    post:
      tags:
        - Admin
      summary: Reject a restaurant registration
      operationId: rejectRestaurant
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
        - name: reason
          in: query
          required: true
          schema:
            type: string
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                type: string
  /admin/restaurants/{id}/approve:
    post:
      tags:
        - Admin
      summary: Approve a restaurant registration
      operationId: approveRestaurant
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
        - name: note
          in: query
          required: false
          schema:
            type: string
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                type: string
  /admin/users/{id}:
    get:
      tags:
        - Admin
      summary: Get user detail by ID
      operationId: getUserDetail
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/AdminUserDetailDto'
    patch:
      tags:
        - Admin
      summary: Update user (active, verified, roles)
      operationId: updateUser
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdminUpdateUserRequestDto'
        required: true
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/AdminUserDetailDto'
  /search:
    get:
      tags:
        - Search
      summary: Search across restaurants and food items
      operationId: search
      parameters:
        - name: q
          in: query
          description: Search query text
          required: true
          schema:
            type: string
        - name: city
          in: query
          description: City filter (optional)
          required: false
          schema:
            type: string
      responses:
        '200':
          description: Search results grouped by restaurant
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/SearchResponseDto'
        '400':
          description: Invalid request parameters
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/SearchResponseDto'
  /restaurants:
    get:
      tags:
        - Restaurant
      summary: Discovery (paginated, randomized when no filters)
      description: GET /api/v1/restaurants — List restaurants. If no city/cuisine filters provided returns randomized sample.
      operationId: discover
      parameters:
        - name: city
          in: query
          description: City
          required: false
          schema:
            type: string
        - name: cuisine
          in: query
          description: Cuisine
          required: false
          schema:
            type: string
        - name: page
          in: query
          description: Page
          required: false
          schema:
            type: integer
            format: int32
            default: 1
        - name: limit
          in: query
          description: Limit
          required: false
          schema:
            type: integer
            format: int32
            default: 12
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/PagedRestaurantsResponseDto'
  /restaurants/{restaurantId}:
    get:
      tags:
        - Restaurant
      summary: Restaurant details
      description: GET /api/v1/restaurants/{restaurantId}
      operationId: details
      parameters:
        - name: restaurantId
          in: path
          description: Restaurant id
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/RestaurantDetailDto'
        '404':
          description: Not found
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/RestaurantDetailDto'
  /restaurants/orders:
    get:
      tags:
        - Restaurant
      summary: List orders for restaurant
      description: GET /api/v1/restaurants/{restaurantId}/orders — List orders for restaurant
      operationId: listRestaurantOrders
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/OrderSummaryDto'
        '404':
          description: Not found
          content:
            '*/*':
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/OrderSummaryDto'
  /restaurants/menu/{restaurantId}:
    get:
      tags:
        - Menu
      summary: Get grouped menu for restaurant
      operationId: getMenu
      parameters:
        - name: restaurantId
          in: path
          description: Restaurant id
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/GroupedMenuResponseDto'
  /restaurants/menu/low-stock:
    get:
      tags:
        - Menu
      summary: Get low stock menu items
      operationId: lowStock
      parameters: []
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/LowStockDto'
  /restaurants/dashboard:
    get:
      tags:
        - Restaurant
      summary: Restaurant dashboard
      description: GET /api/v1/restaurants/{restaurantId}/dashboard — dateFrom/to format yyyy-MM-dd
      operationId: dashboard
      parameters:
        - name: date_from
          in: query
          description: Date from yyyy-MM-dd
          required: false
          schema:
            type: string
          example: '2025-11-01'
        - name: date_to
          in: query
          description: Date to yyyy-MM-dd
          required: false
          schema:
            type: string
          example: '2025-11-04'
        - name: limit_popular
          in: query
          description: limit popular dishes
          required: false
          schema:
            type: integer
            format: int32
            default: 5
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/RestaurantDashboardResponseDto'
  /restaurants/alerts:
    get:
      tags:
        - Restaurant
      summary: Recent alerts for restaurant
      operationId: alerts
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AlertDto'
  /orders/{orderId}:
    get:
      tags:
        - Orders
      summary: Fetch full order details
      operationId: getOrderDetail
      parameters:
        - name: orderId
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/OrderDetailDto'
  /ingredients/suggest:
    get:
      tags:
        - reactive-ingredient-controller
      operationId: suggest
      parameters:
        - name: q
          in: query
          required: true
          schema:
            type: string
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            format: int32
            default: 10
      responses:
        '200':
          description: OK
          content:
            application/x-ndjson:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/IngredientSuggestionDto'
  /image/{fileName}:
    get:
      tags:
        - image-controller
      operationId: getImage
      parameters:
        - name: fileName
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                type: array
                items:
                  type: string
                  format: byte
  /deliveries/{deliveryId}:
    get:
      tags:
        - Deliveries
      summary: Fetch full delivery detail
      operationId: getDeliveryDetail
      parameters:
        - name: deliveryId
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/DeliveryDetailDto'
  /deliveries/history:
    get:
      tags:
        - Deliveries
      summary: List delivery history for partner
      operationId: getHistory
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/DeliverySummaryDto'
  /deliveries/earnings:
    get:
      tags:
        - Deliveries
      summary: Fetch partner's earnings summary
      operationId: getEarnings
      parameters:
        - name: partnerUserId
          in: query
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/EarningsSummaryDto'
  /deliveries/assigned:
    get:
      tags:
        - Deliveries
      summary: List current assigned deliveries
      operationId: getAssignedDeliveries
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/DeliverySummaryDto'
  /cart:
    get:
      tags:
        - Cart
      summary: Fetch saved cart for logged-in user
      operationId: getCart
      responses:
        '200':
          description: Cart fetched successfully
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/CartResponseDto'
  /admin/users:
    get:
      tags:
        - Admin
      summary: List all users (with role filter optional)
      operationId: listUsers
      parameters:
        - name: role
          in: query
          required: false
          schema:
            type: string
        - name: page
          in: query
          required: false
          schema:
            type: integer
            format: int32
            default: 1
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            format: int32
            default: 20
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AdminUserSummaryDto'
  /admin/transactions:
    get:
      tags:
        - Admin - Transactions
      summary: List all payment transactions (paginated)
      operationId: getTransactions
      parameters:
        - name: status
          in: query
          required: false
          schema:
            type: string
        - name: gateway
          in: query
          required: false
          schema:
            type: string
        - name: type
          in: query
          required: false
          schema:
            type: string
        - name: page
          in: query
          required: false
          schema:
            type: integer
            format: int32
            default: 1
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            format: int32
            default: 20
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/TransactionSummaryDto'
  /admin/transactions/{txnId}:
    get:
      tags:
        - Admin - Transactions
      summary: Fetch full transaction log
      operationId: getTransactionDetail
      parameters:
        - name: txnId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/TransactionDetailDto'
  /admin/restaurants/pending:
    get:
      tags:
        - Admin
      summary: Get list of pending restaurants
      operationId: getPendingRestaurants
      responses:
        '200':
          description: OK
          content:
            '*/*':
